# Параметры пайплайна. Изначальные database/split/Ridge сохранены.
database:
  host: 127.0.0.1
  port: 55432
  name: real_estate
  user: real_estate_user
  table: real_estate_dataset_clean

split:
  test_size: 0.2
  random_state: 42

train:
  alpha: 10.0
  catboost:
    iterations: 900
    depth: 6
    learning_rate: 0.07
    l2_leaf_reg: 5.0
    random_seed: 42
    validation_size: 0.15
    early_stopping_rounds: 80
