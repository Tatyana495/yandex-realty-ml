services:
  airflow:
    image: apache/airflow:3.3.2
    container_name: real_estate_airflow
    restart: unless-stopped
    command: standalone

    ports:
      - "127.0.0.1:8081:8080"

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    volumes:
      - airflow_home:/opt/airflow
      - ./dags:/opt/airflow/dags

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  airflow_home:
